name: Publish Medium Review

on:
  push:
    branches: [master]
    paths:
      - "medium/generated/**/*.json"
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative schema-3 article manifest
        required: true
        default: medium/generated/golden-guides/what-happens-when-an-llm-generates-one-token.json
      receipt:
        description: Repository-relative publication receipt
        required: true
        default: medium/publishing/receipts/golden-one-token.json

permissions:
  contents: write

concurrency:
  group: medium-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-unlisted-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Select generated manifests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$MANUAL_MANIFEST" > /tmp/medium-manifests.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'medium/generated/**/*.json' \
              | sort -u > /tmp/medium-manifests.txt
          fi
          if [ ! -s /tmp/medium-manifests.txt ]; then
            echo "No generated article manifests selected."
            exit 1
          fi

      - name: Validate and publish unlisted Medium stories
        id: publish
        env:
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RECEIPT: ${{ inputs.receipt }}
        run: |
          echo "## Medium review story" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r manifest; do
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              receipt="$MANUAL_RECEIPT"
            else
              slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["markdown"].rsplit("/",1)[-1].removesuffix(".md"))' "$manifest")
              receipt="medium/publishing/receipts/$slug.json"
            fi
            python scripts/publish_medium_review.py "$manifest" --receipt "$receipt"
            url=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$receipt")
            echo "- [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/medium-manifests.txt

      - name: Record idempotency receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium/publishing/receipts/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record unlisted Medium review receipt [skip ci]"
          git push
