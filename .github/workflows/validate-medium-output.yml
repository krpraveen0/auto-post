name: Validate Medium Output

on:
  pull_request:
    paths:
      - ".github/workflows/validate-medium-output.yml"
      - "medium/generated/**"
      - "medium/course_series/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate and render generated DOCX files
        run: python scripts/validate_generated_docx.py --root medium/generated --render
