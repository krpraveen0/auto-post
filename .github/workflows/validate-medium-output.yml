name: Validate Medium Output

on:
  pull_request:
    paths:
      - ".github/workflows/validate-medium-output.yml"
      - "medium/generated/**"
      - "medium/course_series/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --global @mermaid-js/mermaid-cli

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate and render generated DOCX files
        run: python scripts/validate_generated_docx.py --root medium/generated --render

      - name: Validate generated article code and infographics
        shell: bash
        run: |
          shopt -s nullglob
          for article in medium/generated/**/*.md; do
            slug="$(basename "$article" .md)"
            validation_dir="/tmp/medium-validation/$slug"
            python scripts/validate_article_content.py "$article" \
              --mermaid-output "$validation_dir/infographic.mmd" \
              --report "$validation_dir/report.json" \
              --skip-url-check
            mmdc --input "$validation_dir/infographic.mmd" \
              --output "$validation_dir/infographic.svg" \
              --backgroundColor transparent
          done
