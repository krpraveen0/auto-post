name: Validate Medium Output

on:
  pull_request:
    paths:
      - ".github/workflows/validate-medium-output.yml"
      - ".github/workflows/daily-medium-course-quality.yml"
      - "medium/generated/**"
      - "medium/course_series/**"
      - "medium/templates/**"
      - "medium/research/**"
      - "medium/reviews/**"
      - "medium/visuals/**"
      - "medium/examples/**"
      - "medium/publishing/**"
      - "medium/schemas/**"
      - "docs/automation/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: medium-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          while IFS= read -r example_dir; do
            python -m unittest discover -s "$example_dir" -v
          done < <(find medium/examples/agentic-ai-engineering -mindepth 1 -maxdepth 1 -type d -name 'part-*' | sort)

      - name: Enforce publishing schema 3 on changed course lessons
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t lessons < <(
            git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- \
              'medium/generated/**/*.md'
          )
          if [ "${#lessons[@]}" -eq 0 ]; then
            echo "No changed generated lessons to score."
            exit 0
          fi
          python scripts/validate_course_lesson.py \
            --require-schema 3 \
            --report-dir quality-reports \
            "${lessons[@]}"

      - name: Validate every article package
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t manifests < <(find medium/generated -name '*.json' -type f | sort)
          if [ "${#manifests[@]}" -gt 0 ]; then
            python scripts/validate_article_package.py "${manifests[@]}"
          fi

      - name: Audit all current-schema lessons on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/validate_course_lesson.py \
            --root medium/generated \
            --discover-current \
            --require-schema 3 \
            --report-dir quality-reports

      - name: Audit all article packages on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          mapfile -t manifests < <(find medium/generated -name '*.json' -type f | sort)
          if [ "${#manifests[@]}" -gt 0 ]; then
            python scripts/validate_article_package.py "${manifests[@]}"
          fi

      - name: Upload structural validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-validation-reports
          path: quality-reports/**
          if-no-files-found: ignore
