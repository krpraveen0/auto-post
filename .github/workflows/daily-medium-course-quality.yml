name: Daily Medium Course Quality Audit

on:
  schedule:
    # 06:00 Asia/Kolkata = 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: daily-medium-course-quality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      COURSE_ROOT: medium/generated/agentic-ai-engineering
      REPORT_DIR: quality-reports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          while IFS= read -r example_dir; do
            python -m unittest discover -s "$example_dir" -v
          done < <(find medium/examples/agentic-ai-engineering -mindepth 1 -maxdepth 1 -type d -name 'part-*' | sort)

      - name: Audit publishing-schema lessons
        run: |
          python scripts/validate_course_lesson.py \
            --root "$COURSE_ROOT" \
            --discover-current \
            --require-schema 3 \
            --report-dir "$REPORT_DIR"

      - name: Validate article package integrity
        run: |
          mapfile -t manifests < <(find "$COURSE_ROOT" -name '*.json' -type f | sort)
          python scripts/validate_article_package.py "${manifests[@]}"

      - name: Upload structural validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-course-structural-reports
          path: quality-reports/**
          if-no-files-found: ignore

# The Linux job validates structure, executable examples, and package integrity;
# it does not assign reader value, author prose, or publish. No desktop
# application, office format, model API key, or write permission is required.
