<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent configuration becomes release evidence through a strict resolution pipeline</title>
  <desc id="desc">A declared configuration and constrained environment overlay enter a strict merge. References bind to exact prompt, model, and tool versions. Schema and cross-field policy checks reject unsafe configurations. The accepted result receives a canonical hash and evidence impact set.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter><style>.h{font:700 38px Arial;fill:#0f172a}.s{font:400 20px Arial;fill:#475569}.t{font:700 21px Arial;fill:#0f172a}.b{font:400 17px Arial;fill:#334155}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="65" y="65" class="h">A checked-in YAML file is only the first layer of release evidence</text><text x="65" y="100" class="s">Resolve aliases and overlays, validate the combined contract, then hash the exact behavior envelope.</text>
  <g filter="url(#shadow)"><rect x="65" y="210" width="250" height="125" rx="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/></g><text x="190" y="260" text-anchor="middle" class="t">DECLARED CONFIG</text><text x="190" y="292" text-anchor="middle" class="b">six explicit surfaces</text>
  <g filter="url(#shadow)"><rect x="65" y="455" width="250" height="125" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/></g><text x="190" y="505" text-anchor="middle" class="t">SAFE OVERLAY</text><text x="190" y="537" text-anchor="middle" class="b">three allowed fields</text>
  <g filter="url(#shadow)"><rect x="410" y="330" width="250" height="125" rx="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/></g><text x="535" y="380" text-anchor="middle" class="t">STRICT MERGE</text><text x="535" y="412" text-anchor="middle" class="b">reject unknown paths</text>
  <g filter="url(#shadow)"><rect x="755" y="330" width="250" height="125" rx="22" fill="#f3e8ff" stroke="#a855f7" stroke-width="3"/></g><text x="880" y="380" text-anchor="middle" class="t">BIND REFERENCES</text><text x="880" y="412" text-anchor="middle" class="b">exact prompt, model, tools</text>
  <g filter="url(#shadow)"><rect x="1100" y="215" width="285" height="125" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/></g><text x="1242" y="265" text-anchor="middle" class="t">VALIDATE CONTRACT</text><text x="1242" y="297" text-anchor="middle" class="b">schema + cross-field policy</text>
  <g filter="url(#shadow)"><rect x="1100" y="465" width="285" height="125" rx="22" fill="#dbeafe" stroke="#0ea5e9" stroke-width="3"/></g><text x="1242" y="515" text-anchor="middle" class="t">RELEASE RECORD</text><text x="1242" y="547" text-anchor="middle" class="b">canonical hash + versions</text>
  <path class="a" d="M315 272C360 280 375 340 410 365"/><path class="a" d="M315 518C360 505 375 445 410 420"/><path class="a" d="M660 393H755"/><path class="a" d="M1005 370C1045 345 1060 295 1100 280"/><path class="a" d="M1242 340V465"/>
  <rect x="420" y="650" width="750" height="130" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="795" y="700" text-anchor="middle" class="t">REJECTED BEFORE A MODEL CALL</text><text x="795" y="735" text-anchor="middle" class="b">unsafe overlay • malformed collection • denied mutation • unresolved alias</text>
  <path class="a" d="M535 455C535 560 625 620 700 650"/><path class="a" d="M1100 315C1000 560 955 620 890 650"/>
  <rect x="190" y="815" width="1220" height="55" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/><text x="800" y="850" text-anchor="middle" class="t">Only the exact resolved hash—not the repository alias—is eligible for evaluation or promotion.</text>
</svg>
