<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Control ownership separates a chatbot, workflow, and bounded agent</title>
  <desc id="desc">Three systems share a chat interface. A chatbot produces text without external action. A deterministic workflow follows fixed code steps. A bounded agent chooses among allowed tools in an observe, decide, act, update loop with approval and stop conditions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 38px Arial,Helvetica,sans-serif;fill:#0f172a}.subtitle{font:400 20px Arial,Helvetica,sans-serif;fill:#475569}.lane-title{font:700 23px Arial,Helvetica,sans-serif}.body{font:400 18px Arial,Helvetica,sans-serif;fill:#334155}.label{font:700 17px Arial,Helvetica,sans-serif}.pill{font:700 15px Arial,Helvetica,sans-serif}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Same interface. Three different control systems.</text>
  <text x="60" y="94" class="subtitle">Trace who chooses the next action—and what boundary constrains it.</text>

  <g filter="url(#shadow)">
    <rect x="500" y="125" width="600" height="88" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="800" y="160" text-anchor="middle" class="label" fill="#0f172a">CHAT INTERFACE</text>
  <text x="800" y="190" text-anchor="middle" class="body">The surface does not reveal control ownership</text>

  <path class="arrow" d="M650 213C560 240 430 245 300 272"/>
  <path class="arrow" d="M800 213V272"/>
  <path class="arrow" d="M950 213C1040 240 1170 245 1300 272"/>

  <g filter="url(#shadow)">
    <rect x="55" y="280" width="465" height="520" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="568" y="280" width="465" height="520" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <rect x="1080" y="280" width="465" height="520" rx="24" fill="#f0fdf4" stroke="#34d399" stroke-width="3"/>
  </g>

  <text x="288" y="326" text-anchor="middle" class="lane-title" fill="#1d4ed8">CHATBOT</text>
  <rect x="95" y="355" width="385" height="275" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="125" y="400" class="body">Conversation → model → response</text>
  <text x="125" y="455" class="label" fill="#1e3a8a">Next action chosen by</text>
  <text x="125" y="486" class="body">No runtime action selection</text>
  <text x="125" y="535" class="label" fill="#1e3a8a">External change</text>
  <text x="125" y="566" class="body">None</text>
  <text x="125" y="608" class="body">Stops when a response is produced</text>
  <rect x="130" y="685" width="315" height="52" rx="26" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="288" y="718" text-anchor="middle" class="pill" fill="#1e3a8a">LANGUAGE, NOT EXECUTION</text>

  <text x="800" y="326" text-anchor="middle" class="lane-title" fill="#6d28d9">DETERMINISTIC WORKFLOW</text>
  <rect x="615" y="365" width="105" height="62" rx="15" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="748" y="455" width="105" height="62" rx="15" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="880" y="545" width="105" height="62" rx="15" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="668" y="403" text-anchor="middle" class="label" fill="#5b21b6">STEP 1</text>
  <text x="800" y="493" text-anchor="middle" class="label" fill="#5b21b6">STEP 2</text>
  <text x="933" y="583" text-anchor="middle" class="label" fill="#5b21b6">STEP 3</text>
  <path d="M720 416L748 455M853 506L880 545" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="640" y="685" width="320" height="52" rx="26" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text x="800" y="708" text-anchor="middle" class="pill" fill="#5b21b6">NEXT ACTION CHOSEN BY</text>
  <text x="800" y="728" text-anchor="middle" class="pill" fill="#5b21b6">PREDEFINED CODE</text>

  <text x="1313" y="326" text-anchor="middle" class="lane-title" fill="#047857">BOUNDED AGENT</text>
  <rect x="1130" y="355" width="365" height="125" rx="22" fill="#065f46" stroke="#047857" stroke-width="3"/>
  <text x="1313" y="397" text-anchor="middle" class="label" fill="#fff">OBSERVE → DECIDE → ACT</text>
  <text x="1313" y="434" text-anchor="middle" class="label" fill="#d1fae5">UPDATE STATE ↺ OR STOP</text>
  <rect x="1130" y="515" width="210" height="88" rx="17" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1235" y="548" text-anchor="middle" class="label" fill="#065f46">ALLOWED TOOLS</text>
  <text x="1235" y="578" text-anchor="middle" class="body">read • propose</text>
  <rect x="1362" y="515" width="133" height="88" rx="17" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1429" y="548" text-anchor="middle" class="label" fill="#92400e">APPROVAL</text>
  <text x="1429" y="578" text-anchor="middle" class="body">high risk</text>
  <path d="M1340 559H1362" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1150" y="685" width="325" height="52" rx="26" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1313" y="718" text-anchor="middle" class="pill" fill="#991b1b">STOP: SUCCESS • LIMIT • ESCALATION</text>

  <text x="800" y="860" text-anchor="middle" class="subtitle">Control flow—not the chat window—reveals what the system is.</text>
</svg>
