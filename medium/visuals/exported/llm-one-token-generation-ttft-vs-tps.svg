<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Time to first token versus tokens per second</title>
  <desc id="desc">A timeline and throughput visual separating startup latency from steady-state generation speed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <style>
      .h{font:700 38px Inter, Arial, Helvetica, sans-serif; fill:#0f172a}
      .t{font:600 24px Inter, Arial, Helvetica, sans-serif; fill:#0f172a}
      .s{font:500 18px Inter, Arial, Helvetica, sans-serif; fill:#334155}
      .box{rx:18;ry:18;stroke-width:3}
      .a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="110" text-anchor="middle" class="h">TTFT measures startup latency. TPS measures steady-state output speed.</text>
  <g transform="translate(120 210)">
    <text x="130" y="40" text-anchor="middle" class="t">Time to first token</text>
    <rect class="box" x="0" y="90" width="220" height="88" fill="#dbeafe" stroke="#60a5fa"/><text x="110" y="144" text-anchor="middle" class="t">Request start</text>
    <path class="a" d="M240 134 L340 134"/>
    <rect class="box" x="350" y="90" width="180" height="88" fill="#ede9fe" stroke="#a78bfa"/><text x="440" y="144" text-anchor="middle" class="t">Prefill</text>
    <path class="a" d="M550 134 L650 134"/>
    <rect class="box" x="660" y="90" width="200" height="88" fill="#fee2e2" stroke="#f87171"/><text x="760" y="144" text-anchor="middle" class="t">First token</text>
    <text x="760" y="216" text-anchor="middle" class="s">This is the part users wait for before the stream begins.</text>
  </g>
  <g transform="translate(120 500)">
    <text x="330" y="40" text-anchor="middle" class="t">Tokens per second</text>
    <rect class="box" x="0" y="90" width="220" height="88" fill="#d5e8d4" stroke="#22c55e"/><text x="110" y="144" text-anchor="middle" class="t">Stream starts</text>
    <path class="a" d="M240 134 L510 134"/>
    <rect class="box" x="520" y="90" width="250" height="88" fill="#d5e8d4" stroke="#22c55e"/><text x="645" y="144" text-anchor="middle" class="t">Tokens keep flowing</text>
    <path class="a" d="M790 134 L1060 134"/>
    <rect class="box" x="1070" y="90" width="190" height="88" fill="#ffe4c7" stroke="#fb923c"/><text x="1165" y="144" text-anchor="middle" class="t">Throughput</text>
    <text x="645" y="216" text-anchor="middle" class="s">This is the pace after the response is already visible.</text>
  </g>
</svg>