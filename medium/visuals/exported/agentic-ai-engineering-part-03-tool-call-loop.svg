<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A bounded host-controlled tool-call loop</title>
  <desc id="desc">A task and tool schemas go to a model. The model proposes a tool call or final answer. The host validates the decision, executes an allow-listed local tool, records a success or error result, then either requests another model turn or stops with an explicit reason.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.h{font:700 38px Arial;fill:#0f172a}.s{font:400 20px Arial;fill:#475569}.t{font:700 21px Arial;fill:#0f172a}.b{font:400 17px Arial;fill:#334155}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="65" y="65" class="h">The model proposes; the host controls execution</text>
  <text x="65" y="100" class="s">Validation, credentials, replay, failure budgets, and stopping remain application responsibilities.</text>
  <g filter="url(#shadow)"><rect x="65" y="185" width="295" height="120" rx="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/></g>
  <text x="212" y="233" text-anchor="middle" class="t">1  TASK + TOOL SCHEMAS</text><text x="212" y="268" text-anchor="middle" class="b">host sends bounded context</text>
  <g filter="url(#shadow)"><rect x="455" y="185" width="295" height="120" rx="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/></g>
  <text x="602" y="233" text-anchor="middle" class="t">2  MODEL DECISION</text><text x="602" y="268" text-anchor="middle" class="b">tool_call or final</text>
  <g filter="url(#shadow)"><rect x="845" y="185" width="325" height="120" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/></g>
  <text x="1007" y="233" text-anchor="middle" class="t">3  HOST VALIDATES</text><text x="1007" y="268" text-anchor="middle" class="b">type • allow-list • schema • call ID</text>
  <g filter="url(#shadow)"><rect x="1260" y="185" width="275" height="120" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/></g>
  <text x="1397" y="233" text-anchor="middle" class="t">4  LOCAL TOOL EXECUTES</text><text x="1397" y="268" text-anchor="middle" class="b">host-owned credentials</text>
  <path class="a" d="M360 245H455"/><path class="a" d="M750 245H845"/><path class="a" d="M1170 245H1260"/>
  <g filter="url(#shadow)"><rect x="845" y="470" width="325" height="120" rx="22" fill="#f3e8ff" stroke="#a855f7" stroke-width="3"/></g>
  <text x="1007" y="518" text-anchor="middle" class="t">5  RESULT ENTERS TRACE</text><text x="1007" y="553" text-anchor="middle" class="b">success or explicit error</text>
  <g filter="url(#shadow)"><rect x="455" y="470" width="295" height="120" rx="22" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/></g>
  <text x="602" y="518" text-anchor="middle" class="t">ANOTHER TURN?</text><text x="602" y="553" text-anchor="middle" class="b">check step and failure budgets</text>
  <g filter="url(#shadow)"><rect x="65" y="470" width="295" height="120" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/></g>
  <text x="212" y="518" text-anchor="middle" class="t">STOP WITH A REASON</text><text x="212" y="553" text-anchor="middle" class="b">final • invalid • failures • limit</text>
  <path class="a" d="M1397 305V410Q1397 530 1170 530"/><path class="a" d="M845 530H750"/><path class="a" d="M602 470V360Q602 325 650 305"/><path class="a" d="M455 530H360"/><path class="a" d="M1007 305Q900 400 360 500"/>
  <rect x="245" y="735" width="1110" height="82" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="785" text-anchor="middle" class="t">Authority boundary: structured output is a proposal, never a direct function pointer.</text>
</svg>
